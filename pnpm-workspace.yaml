packages:
  - ./infra/aws
  - ./infra/azuread
  - ./app

allowBuilds:
  '@swc/core': false
  esbuild: false
  sharp: false
  unrs-resolver: false

minimumReleaseAge: 10080 # 7 days in minutes
minimumReleaseAgeExclude:
  - pnpm@12.13.0

  - next@16.4.1
  - eslint-config-next@16.4.1
  - '@next/eslint-plugin-next@16.4.1'

overrides:
  semver: '>=7'
  uuid@<14.0.0: '>=14.0.0'

trustPolicy: no-downgrade
