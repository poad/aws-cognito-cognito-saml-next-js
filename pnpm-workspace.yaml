packages:
  - ./infra/aws
  - ./infra/azuread
  - ./app

allowBuilds:
  '@swc/core': false
  esbuild: false
  sharp: false
  unrs-resolver: false

minimumReleaseAge: 10080 # 7 days in minutes
minimumReleaseAgeExclude:
  - pnpm@12.23.0

overrides:
  minimatch@<11.0.1: ^11.0.1
  semver: '>=7'
  uuid@<14.0.0: '>=14.0.0'

trustPolicy: no-downgrade
